[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raztech-ingestion-agent"
version = "1.0.0"
description = "RazTech AI Content Pipeline — Ingestion Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RazTech" }]
dependencies = [
    "PyYAML>=6.0",
    "aiofiles>=23.2",
    "watchdog>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
ingestion-agent = "ingestion_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["ingestion_agent"]
